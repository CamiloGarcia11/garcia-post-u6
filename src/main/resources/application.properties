spring.application.name=pedidos-service

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicializacion SQL
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Campaña promocional Black Friday (false por defecto para pruebas base; activable por configuracion)
promo.black-friday.activa=false
